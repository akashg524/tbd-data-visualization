[project]
name = "tbd-data-visualization"
version = "0.1.0"
description = "Enterprise Financial Data Visualization Platform — SQL-first, multi-datasource analytics engine"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Akash Gupta" }]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",

    # --- Analytical Engine ---
    "duckdb>=1.2,<2",
    "pyarrow>=18,<20",

    # --- Cloud Storage & Lakehouse ---
    "boto3>=1.35,<2",            # AWS S3
    "azure-storage-blob>=12.23,<13",  # Azure Blob / ADLS Gen2
    "azure-keyvault-secrets>=4.11,<5", # Azure Key Vault
    "azure-identity>=1.26,<2",         # Azure Entra ID / Managed Identity
    "pyiceberg>=0.12,<1",        # Apache Iceberg table format & catalog
    "google-cloud-storage>=2.18,<3",  # GCS

    # --- Database Connectors (Read-Only) ---
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.30,<1",          # PostgreSQL async
    "aiomysql>=0.2,<1",          # MySQL async
    "pymssql>=2.3,<3",           # SQL Server
    "psycopg[binary]>=3.2,<4",   # PostgreSQL (sync/async)
    "oracledb>=26.0,<27",        # Oracle (pure thin mode)
    "azure-cosmos>=4.17,<5",     # Azure Cosmos DB

    # --- File Formats ---
    "openpyxl>=3.1,<4",          # Excel (.xlsx)
    "python-multipart>=0.0.12",  # File uploads

    # --- Config & Security ---
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "cryptography>=43,<45",      # Credential encryption

    # --- Utilities ---
    "httpx>=0.28,<1",            # Async HTTP client (REST API sources)
    "orjson>=3.10,<4",           # Fast JSON serialization
    "structlog>=24,<26",         # Structured logging
    "rich>=13,<15",              # CLI formatting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",            # TestClient transport
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
]
warehouse = [
    "clickhouse-connect>=0.8,<1",
    "snowflake-connector-python>=3.12,<4",
    "google-cloud-bigquery>=3.26,<4",
]
nosql = [
    "motor>=3.6,<4",             # MongoDB async
    "elasticsearch[async]>=8.16,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ========================================
# Ruff — Linter + Formatter (replaces black, isort, flake8)
# ========================================
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ========================================
# Mypy — Static Type Checking
# ========================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pymssql.*", "aiomysql.*"]
ignore_missing_imports = true

# ========================================
# Pytest
# ========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring live database connections",
]
